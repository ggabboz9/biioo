name: Build firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      - run: pio run
      - name: Collect the files
        run: |
          VERSION=$(grep -oP '#define FW_VERSION\s+"\K[^"]+' src/main.cpp)
          echo "$VERSION" > version.txt
          cp .pio/build/*/firmware.bin firmware.bin
      - name: Publish as the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest firmware
          files: |
            firmware.bin
            version.txt
